; SteamShell XFE Companion 0.1.21
; Copy beside SteamShell-XFE.exe as SteamShell-XFE.ini.
; Missing keys are added automatically without replacing existing values.
; Schema 6 is the exception: XFE no longer owns startup presentation, so an old
; [StartupSplash] section is backed up and removed during migration.

[Companion]
SettingsSchemaVersion=18                                             ; Internal schema used for safe settings upgrades
HeartbeatSeconds=60                                                  ; Liveness log interval; a far larger gap is read as a resume
; The optional logon task (Settings -> Advanced) always runs at normal
; privileges. Elevation was tested on hardware and rejected: while an elevated
; window of ours holds the foreground, Steam cannot inspect it, so Steam never
; registers that it lost focus and keeps acting on controller input underneath
; the Quick Menu. Both respond to the same press, and an A press can activate
; something in Steam while Sleep or Shutdown is being chosen.
;
; The accepted cost: at normal privileges the companion cannot control windows
; belonging to elevated applications, so controller mappings do nothing while an
; elevated anti-cheat game is in front. Measured July 2026.

[Features]
; Cross-cutting feature switches, in the section standalone keeps them in.
; Automatic mouse mode: the controller acts as a pointer without holding
; View/Back, decided by what is in the foreground.
;
; EnableAutoMouseMode is the master switch; AutoMouseExeList names the
; applications it applies to. An empty list turns the feature off as surely as
; the switch does.
;
; The list lives in [Controller] and the switch lives here, which is where
; standalone SteamShell keeps each of them. Schema 12 moved the switch for that
; reason alone -- so a setting is in the same place in both products.
;
; Schema 11 removed the former EnableDesktopAutoMouseMode / DesktopAutoMouseExcludeExeList
; pair. That was an "everywhere except these" mode whose exclusion list was a
; hand-maintained guess at Xbox FSE's process names, standing in for a question
; -- "am I inside Xbox FSE right now?" -- that Windows gives no way to ask. Both
; keys are ignored if present.
;
; Leave Xbox FSE off the list. It is controller-driven, and a pointer inside it
; gets in the way rather than helping. The Quick Menu and Settings chords test
; the real buttons, so a list that turns the pointer on somewhere unwanted is
; always correctable without a keyboard.
EnableAutoMouseMode=true
EnableAutoHideCursor=true                                            ; Hide the pointer once the mouse has been idle for MouseHideDelay
EnableMouseParkOnBoot=true                                           ; Park the pointer out of the way when the companion starts

[QuickMenu]
Enable=true                                                          ; Hold L3+R3 to open/close the living-room Quick Menu
ChordHoldMs=500                                                      ; Required L3+R3 hold time (300-3000 ms)
ShowGameDetection=true                                               ; Game Detection row under System: what the window engine scored and why
MainOrder=Audio|Display|RTSS|SteamMenu|SteamQuickAccess|Tasks|GameBar|Keyboard|MouseMode|Settings|System
HiddenItems=                                                         ; Optional rows to hide; Settings and System stay available
GameScoreMaxRows=8                                                   ; How many scored candidates the Game Detection page lists (1-20)
AccentColor=Purple                                                   ; Steam Blue|Blue|Purple|Magenta|Red|Orange|Yellow|Green|Teal|Custom
AccentColorCustom=107C10                                             ; RRGGBB used when AccentColor=Custom; invalid values fall back to Purple

[Controller]
EnableControllerMouseMode=true                                       ; Enable controller mouse/keyboard mapping (hold View/Back)
EnablePersistentMouseMode=false                                      ; Apply controller mouse/mappings without holding View/Back
; Gated by [Features] EnableAutoMouseMode, which is the master switch for this.
AutoMouseExeList=explorer.exe|brave.exe|chrome.exe|msedge.exe|firefox.exe|notepad.exe|taskmgr.exe  ; EXEs where the View/Back mappings apply WITHOUT holding View/Back
; Input backend: auto (default), xinput, gameinput, or rawinput.
;
; Xbox FSE withholds controller input from background processes at a layer
; beneath both XInput and GameInput, which report identical all-zero state
; inside FSE. RawInput (RIDEV_INPUTSINK) reads the HID reports underneath and
; does receive full input there, including View, Menu, L3 and R3.
;
; RawInput is silent outside FSE, so auto is the setting that works everywhere:
; it reads RawInput while reports are arriving and XInput otherwise. The single
; backends are useful for diagnosis; auto is what you want in normal use.
;
; "rawinput" means RawInput ONLY, with no XInput fallback -- input will be dead
; wherever RawInput is silent, which is the point: it proves whether something is
; genuinely RawInput. Do not leave it set for normal use.
;
; "auto" tries RawInput FIRST everywhere, not only inside Xbox FSE. Whenever HID
; reports are arriving it uses them. The log line that says which backend is
; actually carrying input is "Controller input [rawinput]" or "[xinput]"; the
; RawInput probe lines do not answer that, because the probe logs messages as
; they arrive regardless of which backend consumes them.
;
; The BUILT-IN RawInput layout matches the ROG Ally's controller and is selected
; on report length alone, so any 16-byte HID gamepad gets it. Measured: a separate
; Xbox controller on a different machine decoded correctly with it, so the layout
; is more standard than it first appeared -- but that is fortunate, not
; guaranteed.
;
; Any other controller can be taught once with Settings -> Controller & Cursor ->
; Learn Controller, which writes SteamShell-XFE-Controllers.ini beside this file.
; Ctrl+Alt+Shift+D deletes a learned profile and restores the built-in layout,
; which is the recovery path if a profile is learned badly.
;
; Note: on the Ally the triggers share one combined axis and cancel each other
; out, so LT and RT cannot both be read at once there. Chords must not require
; both. Learned profiles support either shared or independent triggers.
Backend=auto
; Diagnostic only. Logs every XInput slot plus GameInput whenever the combined
; state changes, with per-slot capabilities and the foreground process name.
; Reveals a virtualised pad that forwards only part of the button state.
DiagnosticLogging=false
; Diagnostic only. Registers for background HID gamepad reports via RawInput
; (RIDEV_INPUTSINK) and logs the raw report bytes. Tests whether controller data
; reaches a background process when XInput and GameInput both read zeros. It
; decodes nothing and feeds no mapping.
RawInputProbe=false
; How long a decoded RawInput report stays valid. RawInput is event-driven, so
; the last report is treated as the current state until this expires, then the
; state is cleared so a button cannot appear stuck. Raise it if a held chord is
; released early; lower it if input lingers after letting go.
RawInputStaleMs=5000
ControllerIndex=0                                                    ; 0=first controller
ControllerPollIntervalMs=15                                          ; Poll rate (ms). 15 fires every Windows timer tick; 16 waits for the next
ControllerDeadzone=3000                                              ; Stick deadzone (0-32767)
ControllerMouseSpeed=3200                                            ; Cursor pixels per SECOND at full deflection
ControllerMouseFastMultiplier=2.5                                    ; Multiplier while RT is held
ControllerScrollIntervalMs=80                                        ; Min ms between scroll ticks
ControllerScrollStep=1                                               ; Wheel notches per scroll tick
ControllerChordHoldMs=500                                            ; Long-press threshold (ms) for View/Back + button actions

[Steam]
; Shortcuts sent to whichever application owns the foreground, so they must
; match the bindings configured inside Steam itself.
; MenuShortcut and QuickAccessShortcut only reach Steam while Steam is in front;
; OverlayShortcut is the in-game equivalent.
MenuShortcut=^1
QuickAccessShortcut=^2                                               ; Steam Quick Access shortcut
OverlayShortcut=+{Tab}                                               ; Steam overlay while a game owns the foreground
; View button actions, resolved when the button is RELEASED so that holding View
; as the mapping modifier never triggers them:
;   Steam in front   tap -> MenuShortcut        hold -> QuickAccessShortcut
;   Game in front    tap -> nothing             hold -> OverlayShortcut
EnableViewButtonActions=true
; The tap and the hold are switched separately, because they go wrong in
; different ways. The hold is the one a game can trigger by accident, since View
; is often the scoreboard or map button; the tap only ever acts with Steam in
; front. Turn off whichever one gets in your way and keep the other. Both are
; also gated by EnableViewButtonActions above, and both appear in the Quick Menu
; under Settings so they can be changed from the couch.
EnableViewTapAction=true
EnableViewHoldAction=true                                            ; Hold View: Quick Access with Steam in front, overlay in a game
; Hold threshold with Steam in front. Short, because nothing else competes for
; the View button there.
ViewHoldMs=500
; Hold threshold while a game is in front. Longer on purpose: View is commonly
; the scoreboard or map button, and players hold it, so a short threshold would
; keep raising the Steam overlay mid-game. Set both to the same value if you
; prefer one consistent hold.
ViewHoldInGameMs=1000

[StartupPrograms]
; Applications launched shortly after the companion starts. Add them through
; Settings, or list them here as Program1, Program2, ... up to Program40.
; A program already running is skipped.
Enable=true
DelayMs=2000                                                         ; Wait this long after the companion starts before launching them
StaggerMs=1200                                                       ; Gap between each program launch
; How each program's own windows are presented: Normal, Minimized or Hidden.
; Ported from SteamShell 1.5. Hidden is for background helpers -- overlays,
; controller daemons, sync agents -- that have no business drawing a window over
; Xbox FSE.
;
; Enforced for several seconds after launch rather than only at start, because an
; application with a splash screen, or one that recreates its main window while
; initialising, shows a window the initial show state never applied to. It is
; also the only mechanism that works when LaunchDeElevated is on: there the
; program is started by explorer.exe, which chooses the show state itself.
;
; The enforcement stops after a few seconds on purpose. A permanent sweep would
; re-hide the program the moment you deliberately opened it later.
WindowMode=Hidden
; A child process inherits the parent's elevation. When the companion runs
; elevated, this launches each program through the shell so it gets the ordinary
; user token instead. Leave it on: an elevated Steam passes elevation to every
; game it launches, which Valve advises against.
LaunchDeElevated=true
; Program1=C:\Path\To\Application.exe

[Assist]
; Automatic help from the shared default profile. None of these ever resize, centre
; or maximise a window; Xbox FSE keeps full control of presentation. Assistance
; pauses entirely while any SteamShell XFE window owns the foreground, so it can
; never fight the Quick Menu, Settings, or a dialog.
;
; All three can also be switched from the Quick Menu under Settings, which writes
; this file immediately -- no restart, and no need to open the Settings window.
EnableGameFocusLite=true
EnableSteamAssistLite=true                                           ; Bring Steam back to the front when a game exits
EnableLauncherCleanupLite=true                                       ; Close leftover store launchers once no game is running
; How often the assist checks run. The timer only exists when something above is
; enabled, so a default install does no extra polling at all.
TickIntervalMs=2000
; CPU use that also counts as "a game is running", including when a game's
; window is minimized. A fullscreen/borderless window always counts. 0 disables
; the CPU signal and uses window shape alone.
CpuThresholdPercent=12
; The foreground must stay unchanged this long before cleanup may run.
ForegroundStableSec=30
; --- Which window is the game -------------------------------------------------
; These drive the per-game RTSS frame cap, which is keyed on an executable NAME:
; picking the wrong window writes the cap to another program's profile and
; reports it as saved. Shape alone cannot tell a game from a fullscreen launcher,
; video player or browser, so CPU and audio are weighed alongside it and the
; highest-scoring window wins.
;
; The defaults match SteamShell's, so both products choose the same window. The
; assist features above keep using their own simpler shape test and are not
; affected by anything here.
ScoreFullscreen=70                                                   ; True fullscreen at the screen origin
ScoreBorderlessLarge=45                                              ; Large borderless window
ScoreTitleBonus=10                                                   ; Has a real window title
ScoreCpuAboveThreshold=20                                            ; CPU at or above CpuThresholdPercent
ScoreCpuNonZeroBonus=15                                              ; Some CPU, but below the threshold
ScoreAudioActive=30                                                  ; Producing audio right now
FullscreenTolerance=0.98                                             ; Fraction of the monitor counting as fullscreen
FullscreenPosTolerancePx=2                                           ; Pixels of origin offset still counting as fullscreen
AllowZeroCpuAsCandidate=true                                         ; Keep windows reporting exactly 0% CPU
EnableAudioAssist=true                                               ; Weigh per-process audio at all
AudioPeakThreshold=0.02                                              ; Peak level counting as "making sound"
; Never closed, and never treated as a game.
ProtectedProcesses=explorer.exe|steam.exe|steamwebhelper.exe|AnyFSE.exe|SteamShell-XFE.exe|dwm.exe|csrss.exe|winlogon.exe
; Focus is never taken away from these. Xbox FSE surfaces and the Windows shell
; are showing something deliberately.
IgnoreForegroundProcesses=explorer.exe|ApplicationFrameHost.exe|ShellHost.exe|GameBar.exe|XboxGameBarWidgets.exe|SearchHost.exe|StartMenuExperienceHost.exe|ShellExperienceHost.exe
; Pause assistance while a shell overlay -- the Xbox FSE task/application
; switcher in particular -- is on screen.
;
; IgnoreForegroundProcesses above is not enough for these. An overlay can be
; drawn on top without ever taking the foreground, so the foreground still reads
; as Steam or the game, and Steam Assist Lite "returns to Steam", dismissing the
; switcher the moment it appears. This check looks at what is actually on screen
; instead of only at what owns the foreground.
SuspendOnShellOverlay=true
; Matched against each window's process name, or its class when prefixed with
; "class:".
;
; The Xbox FSE task/application switcher was measured on 2026-07-25: it is an
; explorer.exe window of class XamlExplorerHostIslandWindow, and it DOES own the
; foreground while open. Matching it by class is what makes this work -- an
; explorer.exe entry would also match the desktop, File Explorer and the
; taskbar, and would pause assistance far more often than intended. Prefer
; class: entries; use bare exe names only when you mean every window that
; process owns.
;
; If some other surface still steals focus, run Settings -> Advanced -> Probe
; Screen, bring it up during the six-second countdown, and read the log. It
; lists every top-level window with process, class, size, topmost/foreground
; state, and -- for the ones the assist inventory filters out -- the reason.
; Add whatever it names here.
ShellOverlayProcesses=class:XamlExplorerHostIslandWindow|class:MultitaskingViewFrame|class:Windows.UI.Core.CoreWindow|XboxPcApp.exe|GameBar.exe|XboxGameBarWidgets.exe|ShellHost.exe

[LauncherCleanup]
; Launcher Cleanup Lite tuning. These five carry standalone's own names, so
; schema 12 moved them into standalone's section for them; the rest of the
; cleanup settings stay in [Assist] because XFE names them differently.
; Minimum gap between cleanup runs.
CooldownSec=300
; Wait after a polite close before force closing, when HardKill is enabled.
GracefulCloseMs=4000
; The delayed pass rechecks game/feature state and can close only the original
; PID whose executable and process creation time still match.
HardKill=true
; Skip cleanup entirely while a game appears to be running. Leave this on unless
; you are certain: closing a launcher under a running game can end the game.
RequireNoGame=true
; Store launchers Launcher Cleanup Lite may close. Names only; matched against
; the running process list.
LauncherProcesses=UbisoftConnect.exe|upc.exe|EpicGamesLauncher.exe|EADesktop.exe|EALauncher.exe|Origin.exe|Battle.net.exe|RockstarGamesLauncher.exe|GalaxyClient.exe|RiotClientServices.exe|RiotClientUx.exe|wgc.exe|Heroic.exe|UbisoftConnectService.exe|UplayWebCore.exe|UplayService.exe|EpicWebHelper.exe|EABackgroundService.exe|BlizzardUpdateAgent.exe|Agent.exe|RockstarService.exe|SocialClubHelper.exe|GalaxyClientService.exe|GalaxyCommunication.exe|RiotClientUxRender.exe|legendary.exe|gogdl.exe|nile.exe

[Cursor]
; What is left here after schema 13 moved cursor auto-hide and the park position
; into the sections standalone uses for them. These three have no standalone
; counterpart: its EnableMouseParkOnFocusChange parks on any focus change it
; causes, which is a different rule from "Steam came back to the front".
;
; Parks when a newly foreground window covers most of its monitor and is not a
; known shell, launcher, Steam, Game Bar, or Xbox FSE surface. This is enabled by
; default so a game cannot open with the pointer stranded in the middle.
ParkOnGameStart=true
ParkOnSteamReturn=true                                               ; Park again whenever Steam returns to the foreground
ForegroundPollMs=500                                                 ; How often the foreground is checked for parking decisions

[Timing]
MouseHideDelay=1000                                                  ; Idle time before the pointer is hidden

[MousePark]
; Where the pointer is parked. Same names and section as standalone.
; Which vertical edge the cursor is parked against: right (default) or left.
; Right, because on a TV that is where a cursor which briefly reappears is least
; noticeable, and because Xbox FSE and Steam both keep their navigation on the
; left. MouseParkYPercent is how far down that edge, so the default is
; centre-right.
MouseParkEdge=right
MouseParkYPercent=0.50                                               ; Park cursor at this % of screen height

[Display]
; Display & HDR operates on the Windows primary display. Resolution, refresh
; rate, and Windows Scale are staged in the Quick Menu and applied together
; behind a 15-second safety revert. HDR reads its current Windows Advanced Color
; state and provides explicit Off/On control.

[RTSS]
EnableIntegration=true                                               ; Enabled by default; menu shows SETUP REQUIRED when RTSS is unavailable
Path=C:\Program Files (x86)\RivaTuner Statistics Server\RTSS.exe     ; Optional at the standard install location
UseDllIntegration=true                                               ; Live state/direct control through RTSSHooks64.dll when available
; When RTSSHooks64.dll beside RTSS.exe exposes GetFlags/SetFlags, the Quick
; Menu reads the live global Overlay/Limiter switches, controls them directly,
; and reads the foreground application's actual RTSS FramerateLimit. These
; shortcut settings and PresetFrameCap label remain the automatic fallback for
; other installations. CustomFrameCap retains the live Custom-row value. Set
; UseDllIntegration=false to force shortcut mode.
OverlayControlMode=separate
OverlayToggleShortcut=^+o                                            ; Ctrl+Shift+O - configure the same overlay hotkey in RTSS
OverlayOnShortcut=^+1                                                ; Separate mode: Ctrl+Shift+1 - Show OSD
OverlayOffShortcut=^+2                                               ; Separate mode: Ctrl+Shift+2 - Hide OSD
FrameLimiterControlMode=separate                                     ; Toggle | Separate
PresetFrameCap=158                                                   ; Named Preset entry in the live Frame Limit cycle
CustomFrameCap=158                                                   ; Last Custom FPS value; updated when Custom is adjusted
; RTSS keeps the FPS number in its global profile, but the limiter on/off state
; is runtime-only and "Custom" is a concept RTSS never sees, so the selection is
; recorded here and reapplied once RTSS is running. Needs UseDllIntegration.
RestoreFrameLimitOnStartup=true
; OFF by default, and deliberately so. RTSSHooks64.dll is loaded into the
; CALLING process, so SaveProfile runs with this companion's token, and RTSS
; installs under Program Files -- an unelevated companion can read the cap and
; toggle the limiter flag but cannot set the FPS value or save a per-game
; profile, and the Frame Limit row reports itself read-only.
;
; Setting this to true lets SteamShell-Helper.exe perform that one write in a
; High-integrity process. It costs a UAC prompt when the companion starts and a
; second process for the session, and it does nothing at all unless RTSS is
; installed somewhere this account cannot write. The helper is installed by
; SteamShell.exe Setup in XFE mode; XFE cannot install it itself.
EnableElevatedFrameCapWrites=false
LastFrameCapMode=                                                    ; Written by SteamShell: off | preset | configured | custom
LastFrameCapFps=0                                                    ; Written by SteamShell: FPS of the last selection, kept while Off
CustomFrameCapShortcut=^+f                                           ; Toggle mode: Ctrl+Shift+F
FrameLimiterOnShortcut=^+5                                           ; Separate mode: Ctrl+Shift+5 - enable limiter
FrameLimiterOffShortcut=^+6                                          ; Separate mode: Ctrl+Shift+6 - disable limiter

[ControllerMap]
; What each button does while View/Back is held, or while automatic mouse mode
; is active. ".Short" is a tap, ".Long" is a hold past ControllerChordHoldMs.
;
; A value is either:
;   Builtin:<action>   one of the fixed actions below
;   Send:<keys>        any AutoHotkey Send string, e.g. Send:^+o
;
; Builtin actions: None, LeftClick, RightClick, Enter, Esc, AltF4, TabTip, OSK,
; WinG, StartMenu, Explorer, CtrlAltTab, TaskManager, TaskView, WindowsDesktop,
; QuickMenu, Settings.
;
; A <button>.<Short|Long>.Display entry is a label for the Settings window only.
; It changes nothing about what the binding does; it exists so a Send: string
; reads as "Ctrl+Shift+O" rather than "^+o".
;
; Note: on the ROG Ally the triggers share one combined axis and cancel each
; other out, so a binding must never require LT and RT together.
RB.Short=Builtin:LeftClick
RB.Long=Builtin:None
RT.Short=Builtin:RightClick
RT.Long=Builtin:None
LT.Short=Send:^+o
LT.Short.Display=Ctrl+Shift+O
LT.Long=Send:^+f
LT.Long.Display=Ctrl+Shift+F
LB.Short=Send:^!{Tab}
LB.Short.Display=Ctrl+Alt+Tab
LB.Long=Builtin:TaskManager
A.Short=Builtin:Enter
A.Long=Builtin:None
B.Short=Builtin:Esc
B.Long=Builtin:AltF4
X.Short=Builtin:TabTip
X.Long=Builtin:OSK
Y.Short=Builtin:WinG
Y.Long=Builtin:None
Start.Short=Builtin:StartMenu
Start.Long=Builtin:Explorer
L3.Short=Builtin:None
L3.Long=Builtin:None
R3.Short=Builtin:None
R3.Long=Builtin:None

[Logging]
; Why a window was chosen as the game. Off by default -- this writes a table on
; every evaluation and is a troubleshooting aid, not something a normal session
; should pay for. The table is the same one SteamShell writes, so a log from
; either product reads identically.
;
; OFF          nothing
; TOPN         the header plus the highest-scoring candidates
; DIAGNOSTIC   also the near-misses that were rejected, and why
GameLogMode=OFF
GameLogTopN=3                                                        ; How many candidates to list
GameLogIntervalMs=3000                                               ; Minimum gap between tables
GameLogIncludeTitles=true                                            ; Append the window title column

; The log is rotated once it passes LogRotateMaxKB, keeping LogRotateBackups
; previous files as SteamShell-XFE.log.1, .2 and so on. Set LogRotateBackups=0
; to disable rotation entirely and let the log grow without limit.
;
; Schema 18 moved these here from [Companion]. They size this log and the
; elevated helper's, so neither "Companion" nor SteamShell's old GameLog prefix
; described them; both products name them this way now, which lets the helper
; read one key whichever product started it. An older file's values move here
; automatically.
LogRotateMaxKB=256
LogRotateBackups=2                                                   ; Previous logs to keep; 0 disables rotation entirely

[Setup]
; What this installation believes it is. The registry record SteamShell's Setup
; Assistant writes is the better source while it exists, and is exactly what does
; not survive a move: copy this folder to another PC and the registry is empty
; while this section still describes the old machine.
;
; Read and compared at every start, and never acted on. A mismatch is logged as a
; warning and nothing else happens -- re-run Setup Assistant to re-record it.
; InstallDirectory and DataDirectory are filled in automatically on first run.
SetupState=Complete
SetupVersion=1
Product=XFE
InstallationMode=Portable                                            ; The companion always keeps its data beside its executable
InstallDirectory=                                                    ; Filled in on first run
DataDirectory=                                                       ; Filled in on first run
